[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stella-rea"
version = "0.1.0"
description = "Graph-engineered reverse engineering and explicit-destination apply for Stella"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stella" }]
keywords = ["reverse-engineering", "graph", "dag", "mcp", "agent"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stella-rea = "stella_rea.cli:main"

[tool.setuptools.packages.find]
include = ["stella_rea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
